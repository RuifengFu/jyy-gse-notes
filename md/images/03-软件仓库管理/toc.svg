<svg xmlns="http://www.w3.org/2000/svg" width="760" height="931" viewBox="0 0 760 931" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1f">03 · 软件仓库管理</text><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#444">项目就是用原子变更推进的快照，git 的最佳实践要靠注意力和追问 AI 来学会。</text><rect x="70" y="90" width="670" height="61" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/><circle cx="98" cy="112" r="13" fill="#4a7bd0"/><text x="98" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="122" y="117" font-size="16" font-weight="700" fill="#1d1d1f">GPT-6与还要不要学</text><text x="726" y="117" text-anchor="end" font-size="13" fill="#666">00:00–08:58</text><text x="122" y="140" font-size="14" fill="#333">模型会持续变强，但现阶段学基础仍能解锁 AI 的创造力</text><line x1="98" y1="159" x2="98" y2="181" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="174" font-size="13" fill="#777">转向</text><rect x="70" y="185" width="670" height="61" rx="10" fill="#e6f4ea" stroke="#3c8c55" stroke-width="1.5"/><circle cx="98" cy="207" r="13" fill="#3c8c55"/><text x="98" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="122" y="212" font-size="16" font-weight="700" fill="#1d1d1f">项目就是一个目录</text><text x="726" y="212" text-anchor="end" font-size="13" fill="#666">08:58–17:11</text><text x="122" y="235" font-size="14" fill="#333">软件是需求在信息世界的投影，落地成一个带文件的目录</text><line x1="98" y1="254" x2="98" y2="276" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="269" font-size="13" fill="#777">转向</text><rect x="70" y="280" width="670" height="61" rx="10" fill="#fef7e0" stroke="#c9a227" stroke-width="1.5"/><circle cx="98" cy="302" r="13" fill="#c9a227"/><text x="98" y="307" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="122" y="307" font-size="16" font-weight="700" fill="#1d1d1f">从好项目里学细节</text><text x="726" y="307" text-anchor="end" font-size="13" fill="#666">17:11–24:31</text><text x="122" y="330" font-size="14" fill="#333">学习靠注意力：先自己想一遍，再对照好项目找差距</text><line x1="98" y1="349" x2="98" y2="371" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="364" font-size="13" fill="#777">进一步</text><rect x="70" y="375" width="670" height="61" rx="10" fill="#fce8e6" stroke="#c5523f" stroke-width="1.5"/><circle cx="98" cy="397" r="13" fill="#c5523f"/><text x="98" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="122" y="402" font-size="16" font-weight="700" fill="#1d1d1f">从需求推出git</text><text x="726" y="402" text-anchor="end" font-size="13" fill="#666">24:31–35:01</text><text x="122" y="425" font-size="14" fill="#333">git 的设计都能从真实需求推出，冲突时要把信息给全</text><line x1="98" y1="444" x2="98" y2="466" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="459" font-size="13" fill="#777">举例</text><rect x="70" y="470" width="670" height="61" rx="10" fill="#f3e8fd" stroke="#8a55c9" stroke-width="1.5"/><circle cx="98" cy="492" r="13" fill="#8a55c9"/><text x="98" y="497" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="122" y="497" font-size="16" font-weight="700" fill="#1d1d1f">git实操与最佳实践</text><text x="726" y="497" text-anchor="end" font-size="13" fill="#666">35:01–63:32</text><text x="122" y="520" font-size="14" fill="#333">会用命令只是冰山一角，水下是靠追问 AI 得来的最佳实践</text><line x1="98" y1="539" x2="98" y2="561" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="554" font-size="13" fill="#777">进一步</text><rect x="70" y="565" width="670" height="61" rx="10" fill="#e4f7fb" stroke="#2b93a8" stroke-width="1.5"/><circle cx="98" cy="587" r="13" fill="#2b93a8"/><text x="98" y="592" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="122" y="592" font-size="16" font-weight="700" fill="#1d1d1f">git底层：持久化目录树</text><text x="726" y="592" text-anchor="end" font-size="13" fill="#666">63:32–78:23</text><text x="122" y="615" font-size="14" fill="#333">git 是持久化的目录树，新版本只复制改动到根的路径</text><line x1="98" y1="634" x2="98" y2="656" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="649" font-size="13" fill="#777">举例</text><rect x="70" y="660" width="670" height="61" rx="10" fill="#fdeee0" stroke="#d27b2c" stroke-width="1.5"/><circle cx="98" cy="682" r="13" fill="#d27b2c"/><text x="98" y="687" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="122" y="687" font-size="16" font-weight="700" fill="#1d1d1f">AI直出教学工具</text><text x="726" y="687" text-anchor="end" font-size="13" fill="#666">78:23–86:18</text><text x="122" y="710" font-size="14" fill="#333">人把住架构，AI 直出的教学工具就能达到可用</text><line x1="98" y1="729" x2="98" y2="751" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="744" font-size="13" fill="#777">回到</text><rect x="70" y="755" width="670" height="61" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><circle cx="98" cy="777" r="13" fill="#78909c"/><text x="98" y="782" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="122" y="782" font-size="16" font-weight="700" fill="#1d1d1f">规范让协作一致</text><text x="726" y="782" text-anchor="end" font-size="13" fill="#666">86:18–93:47</text><text x="122" y="805" font-size="14" fill="#333">约定俗成的规范保证一致性，AI 能替你把细节守住</text><line x1="98" y1="824" x2="98" y2="846" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="839" font-size="13" fill="#777">因此</text><rect x="70" y="850" width="670" height="61" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/><circle cx="98" cy="872" r="13" fill="#5c6bc0"/><text x="98" y="877" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">9</text><text x="122" y="877" font-size="16" font-weight="700" fill="#1d1d1f">原子快照与架构先行</text><text x="726" y="877" text-anchor="end" font-size="13" fill="#666">93:47–100:16</text><text x="122" y="900" font-size="14" fill="#333">项目管理就是把需求拆成可审计的原子快照，并先定好架构</text></svg>
