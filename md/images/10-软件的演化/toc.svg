<svg xmlns="http://www.w3.org/2000/svg" width="760" height="953" viewBox="0 0 760 953" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1f">10 · 软件的演化 (航母是怎么造出来的)</text><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#444">复杂系统都由一连串小改动演化而来，读懂它要回溯历史；</text><text x="380.0" y="92" text-anchor="middle" font-size="15" fill="#444">AI已能做小事，缺的是判断大架构取舍的品味。</text><rect x="70" y="112" width="670" height="61" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/><circle cx="98" cy="134" r="13" fill="#4a7bd0"/><text x="98" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="122" y="139" font-size="16" font-weight="700" fill="#1d1d1f">数学之美是人脑的局限</text><text x="726" y="139" text-anchor="end" font-size="13" fill="#666">00:00–08:55</text><text x="122" y="162" font-size="14" fill="#333">数学的美是人脑只能装下简单抽象的补偿，真实世界的结构很乱</text><line x1="98" y1="181" x2="98" y2="203" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="196" font-size="13" fill="#777">转向</text><rect x="70" y="207" width="670" height="61" rx="10" fill="#e6f4ea" stroke="#3c8c55" stroke-width="1.5"/><circle cx="98" cy="229" r="13" fill="#3c8c55"/><text x="98" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="122" y="234" font-size="16" font-weight="700" fill="#1d1d1f">用AI轨迹证明自己</text><text x="726" y="234" text-anchor="end" font-size="13" fill="#666">08:55–19:50</text><text x="122" y="257" font-size="14" fill="#333">AI交互轨迹是难以伪造的人物画像，能换来优势也等于交出灵魂</text><line x1="98" y1="276" x2="98" y2="298" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="291" font-size="13" fill="#777">回到</text><rect x="70" y="302" width="670" height="61" rx="10" fill="#fef7e0" stroke="#c9a227" stroke-width="1.5"/><circle cx="98" cy="324" r="13" fill="#c9a227"/><text x="98" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="122" y="329" font-size="16" font-weight="700" fill="#1d1d1f">harness是还没放飞机的航母</text><text x="726" y="329" text-anchor="end" font-size="13" fill="#666">19:50–23:30</text><text x="122" y="352" font-size="14" fill="#333">everything is a plugin 让 harness 像操作系统，生态才是未来</text><line x1="98" y1="371" x2="98" y2="393" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="386" font-size="13" fill="#777">举例</text><rect x="70" y="397" width="670" height="61" rx="10" fill="#fce8e6" stroke="#c5523f" stroke-width="1.5"/><circle cx="98" cy="419" r="13" fill="#c5523f"/><text x="98" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="122" y="424" font-size="16" font-weight="700" fill="#1d1d1f">航母不是一天造成的</text><text x="726" y="424" text-anchor="end" font-size="13" fill="#666">23:30–38:45</text><text x="122" y="447" font-size="14" fill="#333">航母这类复杂系统，都是从最简单的原点一点点演化出来的</text><line x1="98" y1="466" x2="98" y2="488" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="481" font-size="13" fill="#777">进一步</text><rect x="70" y="492" width="670" height="61" rx="10" fill="#f3e8fd" stroke="#8a55c9" stroke-width="1.5"/><circle cx="98" cy="514" r="13" fill="#8a55c9"/><text x="98" y="519" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="122" y="519" font-size="16" font-weight="700" fill="#1d1d1f">回到最简版本再rebase</text><text x="726" y="519" text-anchor="end" font-size="13" fill="#666">38:45–50:51</text><text x="122" y="542" font-size="14" fill="#333">想理解复杂系统，就回到它的最简版本，把功能一路rebase过去</text><line x1="98" y1="561" x2="98" y2="583" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="576" font-size="13" fill="#777">进一步</text><rect x="70" y="587" width="670" height="61" rx="10" fill="#e4f7fb" stroke="#2b93a8" stroke-width="1.5"/><circle cx="98" cy="609" r="13" fill="#2b93a8"/><text x="98" y="614" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="122" y="614" font-size="16" font-weight="700" fill="#1d1d1f">小事已被解决，缺品味基准</text><text x="726" y="614" text-anchor="end" font-size="13" fill="#666">50:51–65:00</text><text x="122" y="637" font-size="14" fill="#333">SWE-bench衡量的是小事，稀疏的大架构决策需要taste bench</text><line x1="98" y1="656" x2="98" y2="678" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="671" font-size="13" fill="#777">举例</text><rect x="70" y="682" width="670" height="61" rx="10" fill="#fdeee0" stroke="#d27b2c" stroke-width="1.5"/><circle cx="98" cy="704" r="13" fill="#d27b2c"/><text x="98" y="709" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="122" y="709" font-size="16" font-weight="700" fill="#1d1d1f">从提交史读懂项目</text><text x="726" y="709" text-anchor="end" font-size="13" fill="#666">65:00–78:03</text><text x="122" y="732" font-size="14" fill="#333">读提交历史能还原项目的演化，设计由RFC走向ADR</text><line x1="98" y1="751" x2="98" y2="773" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="766" font-size="13" fill="#777">进一步</text><rect x="70" y="777" width="670" height="61" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><circle cx="98" cy="799" r="13" fill="#78909c"/><text x="98" y="804" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="122" y="804" font-size="16" font-weight="700" fill="#1d1d1f">用检查器挡住AI slop</text><text x="726" y="804" text-anchor="end" font-size="13" fill="#666">78:03–90:09</text><text x="122" y="827" font-size="14" fill="#333">没法阻止AI生成slop，只能用验证器在提交前拦下来</text><line x1="98" y1="846" x2="98" y2="868" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="861" font-size="13" fill="#777">但是</text><rect x="70" y="872" width="670" height="61" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/><circle cx="98" cy="894" r="13" fill="#5c6bc0"/><text x="98" y="899" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">9</text><text x="122" y="899" font-size="16" font-weight="700" fill="#1d1d1f">品味靠自我改进循环</text><text x="726" y="899" text-anchor="end" font-size="13" fill="#666">90:09–99:56</text><text x="122" y="922" font-size="14" fill="#333">否定式提示词无效，需要反例驱动的循环去提炼品味</text></svg>
