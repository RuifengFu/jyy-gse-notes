<svg xmlns="http://www.w3.org/2000/svg" width="760" height="931" viewBox="0 0 760 931" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1f">13 · 软件分析工具</text><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#444">软件工程工具给黑盒软件提供反馈。模型能读懂人类意图，工具将从机械规则走向非形式验证。</text><rect x="70" y="90" width="670" height="61" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/><circle cx="98" cy="112" r="13" fill="#4a7bd0"/><text x="98" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="122" y="117" font-size="16" font-weight="700" fill="#1d1d1f">软件工程的自我改进</text><text x="726" y="117" text-anchor="end" font-size="13" fill="#666">00:00–10:26</text><text x="122" y="140" font-size="14" fill="#333">软件工程靠经验、流程、工具积累，工具改进工具是自我改进史</text><line x1="98" y1="159" x2="98" y2="181" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="174" font-size="13" fill="#777">转向</text><rect x="70" y="185" width="670" height="61" rx="10" fill="#e6f4ea" stroke="#3c8c55" stroke-width="1.5"/><circle cx="98" cy="207" r="13" fill="#3c8c55"/><text x="98" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="122" y="212" font-size="16" font-weight="700" fill="#1d1d1f">传统软件分析</text><text x="726" y="212" text-anchor="end" font-size="13" fill="#666">10:26–29:52</text><text x="122" y="235" font-size="14" fill="#333">传统分析工具只能把程序当数学对象，按明确规则执行</text><line x1="98" y1="254" x2="98" y2="276" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="269" font-size="13" fill="#777">但是</text><rect x="70" y="280" width="670" height="61" rx="10" fill="#fef7e0" stroke="#c9a227" stroke-width="1.5"/><circle cx="98" cy="302" r="13" fill="#c9a227"/><text x="98" y="307" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="122" y="307" font-size="16" font-weight="700" fill="#1d1d1f">Rice 定理与舍弃</text><text x="726" y="307" text-anchor="end" font-size="13" fill="#666">29:52–38:15</text><text x="122" y="330" font-size="14" fill="#333">通用分析器不存在，但只需对人类写的一小部分程序负责</text><line x1="98" y1="349" x2="98" y2="371" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="364" font-size="13" fill="#777">举例</text><rect x="70" y="375" width="670" height="61" rx="10" fill="#fce8e6" stroke="#c5523f" stroke-width="1.5"/><circle cx="98" cy="397" r="13" fill="#c5523f"/><text x="98" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="122" y="402" font-size="16" font-weight="700" fill="#1d1d1f">类型、Lint 与测试</text><text x="726" y="402" text-anchor="end" font-size="13" fill="#666">38:15–49:46</text><text x="122" y="425" font-size="14" fill="#333">每种工具以不同代价，换取对正确性的不同信心</text><line x1="98" y1="444" x2="98" y2="466" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="459" font-size="13" fill="#777">因此</text><rect x="70" y="470" width="670" height="61" rx="10" fill="#f3e8fd" stroke="#8a55c9" stroke-width="1.5"/><circle cx="98" cy="492" r="13" fill="#8a55c9"/><text x="98" y="497" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="122" y="497" font-size="16" font-weight="700" fill="#1d1d1f">工具给软件反馈</text><text x="726" y="497" text-anchor="end" font-size="13" fill="#666">49:46–57:12</text><text x="122" y="520" font-size="14" fill="#333">工具让黑盒软件有了反馈，反馈是强化学习飞轮的燃料</text><line x1="98" y1="539" x2="98" y2="561" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="554" font-size="13" fill="#777">但是</text><rect x="70" y="565" width="670" height="61" rx="10" fill="#e4f7fb" stroke="#2b93a8" stroke-width="1.5"/><circle cx="98" cy="587" r="13" fill="#2b93a8"/><text x="98" y="592" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="122" y="592" font-size="16" font-weight="700" fill="#1d1d1f">程序是人的样本</text><text x="726" y="592" text-anchor="end" font-size="13" fill="#666">57:12–63:57</text><text x="122" y="615" font-size="14" fill="#333">程序既是形式化的机器，也是人类活动留下的概率样本</text><line x1="98" y1="634" x2="98" y2="656" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="649" font-size="13" fill="#777">进一步</text><rect x="70" y="660" width="670" height="61" rx="10" fill="#fdeee0" stroke="#d27b2c" stroke-width="1.5"/><circle cx="98" cy="682" r="13" fill="#d27b2c"/><text x="98" y="687" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="122" y="687" font-size="16" font-weight="700" fill="#1d1d1f">非形式验证的目标</text><text x="726" y="687" text-anchor="end" font-size="13" fill="#666">63:57–70:41</text><text x="122" y="710" font-size="14" fill="#333">终极目标是验证所有执行轨迹都与人类意图对齐</text><line x1="98" y1="729" x2="98" y2="751" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="744" font-size="13" fill="#777">举例</text><rect x="70" y="755" width="670" height="61" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><circle cx="98" cy="777" r="13" fill="#78909c"/><text x="98" y="782" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="122" y="782" font-size="16" font-weight="700" fill="#1d1d1f">日志挖掘与可视化</text><text x="726" y="782" text-anchor="end" font-size="13" fill="#666">70:41–83:21</text><text x="122" y="805" font-size="14" fill="#333">日志挖掘和状态可视化已是非形式验证的雏形</text><line x1="98" y1="824" x2="98" y2="846" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="839" font-size="13" fill="#777">转向</text><rect x="70" y="850" width="670" height="61" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/><circle cx="98" cy="872" r="13" fill="#5c6bc0"/><text x="98" y="877" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">9</text><text x="122" y="877" font-size="16" font-weight="700" fill="#1d1d1f">No doc 与软工终结</text><text x="726" y="877" text-anchor="end" font-size="13" fill="#666">83:21–91:37</text><text x="122" y="900" font-size="14" fill="#333">文档应从代码导出，模型学会重做需求后传统软工终结</text></svg>
