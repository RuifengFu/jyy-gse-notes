<svg xmlns="http://www.w3.org/2000/svg" width="760" height="858" viewBox="0 0 760 858" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1f">07 · 需求和架构 (2)</text><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#444">需求面对本质复杂性，架构分解它；好架构能生长，而 Event Sourcin</text><text x="380.0" y="92" text-anchor="middle" font-size="15" fill="#444">g 保留历史，避免只存当前状态造成的不一致。</text><rect x="70" y="112" width="670" height="61" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/><circle cx="98" cy="134" r="13" fill="#4a7bd0"/><text x="98" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="122" y="139" font-size="16" font-weight="700" fill="#1d1d1f">需求面对本质复杂性</text><text x="726" y="139" text-anchor="end" font-size="13" fill="#666">00:00–14:36</text><text x="122" y="162" font-size="14" fill="#333">需求工程直面本质复杂性，架构负责分解它并收缩可能性</text><line x1="98" y1="181" x2="98" y2="203" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="196" font-size="13" fill="#777">转向</text><rect x="70" y="207" width="670" height="61" rx="10" fill="#e6f4ea" stroke="#3c8c55" stroke-width="1.5"/><circle cx="98" cy="229" r="13" fill="#3c8c55"/><text x="98" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="122" y="234" font-size="16" font-weight="700" fill="#1d1d1f">用 AI 读经典论文</text><text x="726" y="234" text-anchor="end" font-size="13" fill="#666">14:36–34:09</text><text x="122" y="257" font-size="14" fill="#333">人脑容量有限，所以必须靠抽象和分层来分解复杂性</text><line x1="98" y1="276" x2="98" y2="298" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="291" font-size="13" fill="#777">进一步</text><rect x="70" y="302" width="670" height="61" rx="10" fill="#fef7e0" stroke="#c9a227" stroke-width="1.5"/><circle cx="98" cy="324" r="13" fill="#c9a227"/><text x="98" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="122" y="329" font-size="16" font-weight="700" fill="#1d1d1f">能生长的架构</text><text x="726" y="329" text-anchor="end" font-size="13" fill="#666">34:09–49:42</text><text x="122" y="352" font-size="14" fill="#333">好架构要能生长，扩展必须是一等公民并可组合</text><line x1="98" y1="371" x2="98" y2="393" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="386" font-size="13" fill="#777">举例</text><rect x="70" y="397" width="670" height="61" rx="10" fill="#fce8e6" stroke="#c5523f" stroke-width="1.5"/><circle cx="98" cy="419" r="13" fill="#c5523f"/><text x="98" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="122" y="424" font-size="16" font-weight="700" fill="#1d1d1f">Unix、数据库与互联网</text><text x="726" y="424" text-anchor="end" font-size="13" fill="#666">49:42–63:50</text><text x="122" y="447" font-size="14" fill="#333">Unix、关系数据库、Internet 靠简单统一的接口长出生态</text><line x1="98" y1="466" x2="98" y2="488" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="481" font-size="13" fill="#777">转向</text><rect x="70" y="492" width="670" height="61" rx="10" fill="#f3e8fd" stroke="#8a55c9" stroke-width="1.5"/><circle cx="98" cy="514" r="13" fill="#8a55c9"/><text x="98" y="519" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="122" y="519" font-size="16" font-weight="700" fill="#1d1d1f">业务系统与 MVC</text><text x="726" y="519" text-anchor="end" font-size="13" fill="#666">63:50–72:47</text><text x="122" y="542" font-size="14" fill="#333">需求点映射成数据库事务，视图是状态的纯函数投射</text><line x1="98" y1="561" x2="98" y2="583" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="576" font-size="13" fill="#777">进一步</text><rect x="70" y="587" width="670" height="61" rx="10" fill="#e4f7fb" stroke="#2b93a8" stroke-width="1.5"/><circle cx="98" cy="609" r="13" fill="#2b93a8"/><text x="98" y="614" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="122" y="614" font-size="16" font-weight="700" fill="#1d1d1f">MVVM 与 React</text><text x="726" y="614" text-anchor="end" font-size="13" fill="#666">72:47–79:07</text><text x="122" y="637" font-size="14" fill="#333">界面自身的状态也要建模，界面是状态的纯函数</text><line x1="98" y1="656" x2="98" y2="678" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="671" font-size="13" fill="#777">但是</text><rect x="70" y="682" width="670" height="61" rx="10" fill="#fdeee0" stroke="#d27b2c" stroke-width="1.5"/><circle cx="98" cy="704" r="13" fill="#d27b2c"/><text x="98" y="709" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="122" y="709" font-size="16" font-weight="700" fill="#1d1d1f">长流程里的状态不一致</text><text x="726" y="709" text-anchor="end" font-size="13" fill="#666">79:07–82:50</text><text x="122" y="732" font-size="14" fill="#333">只存当前状态会丢掉过程，长流程必然出现不一致数据</text><line x1="98" y1="751" x2="98" y2="773" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="766" font-size="13" fill="#777">因此</text><rect x="70" y="777" width="670" height="61" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><circle cx="98" cy="799" r="13" fill="#78909c"/><text x="98" y="804" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="122" y="804" font-size="16" font-weight="700" fill="#1d1d1f">Event Sourcing</text><text x="726" y="804" text-anchor="end" font-size="13" fill="#666">82:50–99:43</text><text x="122" y="827" font-size="14" fill="#333">记录事件而非当前状态，现在才是过去的可重放结果</text></svg>
