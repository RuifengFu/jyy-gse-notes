<svg xmlns="http://www.w3.org/2000/svg" width="760" height="858" viewBox="0 0 760 858" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1f">02 · 提示词工程</text><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#444">提示词的本质是整条上下文工程：把意图和可验证标准写进上下</text><text x="380.0" y="92" text-anchor="middle" font-size="15" fill="#444">文，模型就会一步步逼近，人要保住领域知识与判断。</text><rect x="70" y="112" width="670" height="61" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/><circle cx="98" cy="134" r="13" fill="#4a7bd0"/><text x="98" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="122" y="139" font-size="16" font-weight="700" fill="#1d1d1f">提示词是整条上下文</text><text x="726" y="139" text-anchor="end" font-size="13" fill="#666">00:00–04:45</text><text x="122" y="162" font-size="14" fill="#333">提示词是模型看到的整条上下文，不只是对话框里那句话</text><line x1="98" y1="181" x2="98" y2="203" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="196" font-size="13" fill="#777">举例</text><rect x="70" y="207" width="670" height="61" rx="10" fill="#e6f4ea" stroke="#3c8c55" stroke-width="1.5"/><circle cx="98" cy="229" r="13" fill="#3c8c55"/><text x="98" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="122" y="234" font-size="16" font-weight="700" fill="#1d1d1f">遇事先问 AI</text><text x="726" y="234" text-anchor="end" font-size="13" fill="#666">04:45–18:34</text><text x="122" y="257" font-size="14" fill="#333">遇到不懂的东西立刻问 agent，连它自己的上下文和源码都能拆开看</text><line x1="98" y1="276" x2="98" y2="298" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="291" font-size="13" fill="#777">进一步</text><rect x="70" y="302" width="670" height="61" rx="10" fill="#fef7e0" stroke="#c9a227" stroke-width="1.5"/><circle cx="98" cy="324" r="13" fill="#c9a227"/><text x="98" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="122" y="329" font-size="16" font-weight="700" fill="#1d1d1f">意图写清楚且可验证</text><text x="726" y="329" text-anchor="end" font-size="13" fill="#666">18:34–33:23</text><text x="122" y="352" font-size="14" fill="#333">意图和规格写得越明确可验证，agent 越不会漂移</text><line x1="98" y1="371" x2="98" y2="393" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="386" font-size="13" fill="#777">因此</text><rect x="70" y="397" width="670" height="61" rx="10" fill="#fce8e6" stroke="#c5523f" stroke-width="1.5"/><circle cx="98" cy="419" r="13" fill="#c5523f"/><text x="98" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="122" y="424" font-size="16" font-weight="700" fill="#1d1d1f">思维链与指令遵循</text><text x="726" y="424" text-anchor="end" font-size="13" fill="#666">33:23–54:21</text><text x="122" y="447" font-size="14" fill="#333">思维链把上下文当纸笔，有 verifier 的指令模型能逐步逼近</text><line x1="98" y1="466" x2="98" y2="488" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="481" font-size="13" fill="#777">但是</text><rect x="70" y="492" width="670" height="61" rx="10" fill="#f3e8fd" stroke="#8a55c9" stroke-width="1.5"/><circle cx="98" cy="514" r="13" fill="#8a55c9"/><text x="98" y="519" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="122" y="519" font-size="16" font-weight="700" fill="#1d1d1f">上下文污染与对齐</text><text x="726" y="519" text-anchor="end" font-size="13" fill="#666">54:21–75:38</text><text x="122" y="542" font-size="14" fill="#333">逻辑自洽的材料会污染上下文，要先让 AI 与你对齐</text><line x1="98" y1="561" x2="98" y2="583" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="576" font-size="13" fill="#777">转向</text><rect x="70" y="587" width="670" height="61" rx="10" fill="#e4f7fb" stroke="#2b93a8" stroke-width="1.5"/><circle cx="98" cy="609" r="13" fill="#2b93a8"/><text x="98" y="614" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="122" y="614" font-size="16" font-weight="700" fill="#1d1d1f">好代码引导 AI 维护</text><text x="726" y="614" text-anchor="end" font-size="13" fill="#666">75:38–83:57</text><text x="122" y="637" font-size="14" fill="#333">维护良好的大型系统里，好代码会正向引导 AI</text><line x1="98" y1="656" x2="98" y2="678" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="671" font-size="13" fill="#777">回到</text><rect x="70" y="682" width="670" height="61" rx="10" fill="#fdeee0" stroke="#d27b2c" stroke-width="1.5"/><circle cx="98" cy="704" r="13" fill="#d27b2c"/><text x="98" y="709" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="122" y="709" font-size="16" font-weight="700" fill="#1d1d1f">AI 不万能，人来引导</text><text x="726" y="709" text-anchor="end" font-size="13" fill="#666">83:57–92:24</text><text x="122" y="732" font-size="14" fill="#333">AI 没有超能力时，人要用领域知识把它引到正确方向</text><line x1="98" y1="751" x2="98" y2="773" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="766" font-size="13" fill="#777">转向</text><rect x="70" y="777" width="670" height="61" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><circle cx="98" cy="799" r="13" fill="#78909c"/><text x="98" y="804" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="122" y="804" font-size="16" font-weight="700" fill="#1d1d1f">开放问题用算力换智力</text><text x="726" y="804" text-anchor="end" font-size="13" fill="#666">92:24–98:27</text><text x="122" y="827" font-size="14" fill="#333">开放问题要拆成可验证的小块，用算力换智力</text></svg>
