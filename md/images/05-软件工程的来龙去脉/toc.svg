<svg xmlns="http://www.w3.org/2000/svg" width="760" height="953" viewBox="0 0 760 953" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1f">05 · 软件工程的来龙去脉</text><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#444">AI 让写代码近乎免费，但软件工程的第一性原理仍在：尽早暴露意图</text><text x="380.0" y="92" text-anchor="middle" font-size="15" fill="#444">、规约、实现之间的差距，原文和经典能帮人驾驭 AI。</text><rect x="70" y="112" width="670" height="61" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/><circle cx="98" cy="134" r="13" fill="#4a7bd0"/><text x="98" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="122" y="139" font-size="16" font-weight="700" fill="#1d1d1f">AI 进化快到超预期</text><text x="726" y="139" text-anchor="end" font-size="13" fill="#666">00:00–10:07</text><text x="122" y="162" font-size="14" fill="#333">AI 进步速度远超预期，模型当前的短板是品位和长期直觉</text><line x1="98" y1="181" x2="98" y2="203" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="196" font-size="13" fill="#777">进一步</text><rect x="70" y="207" width="670" height="61" rx="10" fill="#e6f4ea" stroke="#3c8c55" stroke-width="1.5"/><circle cx="98" cy="229" r="13" fill="#3c8c55"/><text x="98" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="122" y="234" font-size="16" font-weight="700" fill="#1d1d1f">数据分布工程与飞轮</text><text x="726" y="234" text-anchor="end" font-size="13" fill="#666">10:07–18:28</text><text x="122" y="257" font-size="14" fill="#333">每加一个新领域，模型整体变强，学术小实验被边缘化</text><line x1="98" y1="276" x2="98" y2="298" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="291" font-size="13" fill="#777">转向</text><rect x="70" y="302" width="670" height="61" rx="10" fill="#fef7e0" stroke="#c9a227" stroke-width="1.5"/><circle cx="98" cy="324" r="13" fill="#c9a227"/><text x="98" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="122" y="329" font-size="16" font-weight="700" fill="#1d1d1f">MVP 与软件消亡</text><text x="726" y="329" text-anchor="end" font-size="13" fill="#666">18:28–28:52</text><text x="122" y="352" font-size="14" fill="#333">MVP 补齐意图与实现的缺口，AI 让定制软件近乎免费</text><line x1="98" y1="371" x2="98" y2="393" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="386" font-size="13" fill="#777">但是</text><rect x="70" y="397" width="670" height="61" rx="10" fill="#fce8e6" stroke="#c5523f" stroke-width="1.5"/><circle cx="98" cy="419" r="13" fill="#c5523f"/><text x="98" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="122" y="424" font-size="16" font-weight="700" fill="#1d1d1f">软件工程为何诞生</text><text x="726" y="424" text-anchor="end" font-size="13" fill="#666">28:52–50:18</text><text x="122" y="447" font-size="14" fill="#333">软件危机逼人从第一性原理造出可交付、可维护的工程方法</text><line x1="98" y1="466" x2="98" y2="488" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="481" font-size="13" fill="#777">进一步</text><rect x="70" y="492" width="670" height="61" rx="10" fill="#f3e8fd" stroke="#8a55c9" stroke-width="1.5"/><circle cx="98" cy="514" r="13" fill="#8a55c9"/><text x="98" y="519" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="122" y="519" font-size="16" font-weight="700" fill="#1d1d1f">瀑布模型原文怎么说</text><text x="726" y="519" text-anchor="end" font-size="13" fill="#666">50:18–60:10</text><text x="122" y="542" font-size="14" fill="#333">Royce 原文是批判瀑布，主张先做一版试点程序</text><line x1="98" y1="561" x2="98" y2="583" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="576" font-size="13" fill="#777">转向</text><rect x="70" y="587" width="670" height="61" rx="10" fill="#e4f7fb" stroke="#2b93a8" stroke-width="1.5"/><circle cx="98" cy="609" r="13" fill="#2b93a8"/><text x="98" y="614" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="122" y="614" font-size="16" font-weight="700" fill="#1d1d1f">AI 时代直读一手资料</text><text x="726" y="614" text-anchor="end" font-size="13" fill="#666">60:10–64:52</text><text x="122" y="637" font-size="14" fill="#333">教科书是有损压缩，AI 能给每个人做一对一的压缩</text><line x1="98" y1="656" x2="98" y2="678" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="671" font-size="13" fill="#777">进一步</text><rect x="70" y="682" width="670" height="61" rx="10" fill="#fdeee0" stroke="#d27b2c" stroke-width="1.5"/><circle cx="98" cy="704" r="13" fill="#d27b2c"/><text x="98" y="709" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="122" y="709" font-size="16" font-weight="700" fill="#1d1d1f">数据依赖解释瀑布</text><text x="726" y="709" text-anchor="end" font-size="13" fill="#666">64:52–74:59</text><text x="122" y="732" font-size="14" fill="#333">返工代价来自数据依赖，MVP、敏捷、TDD 都在缩短反馈</text><line x1="98" y1="751" x2="98" y2="773" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="766" font-size="13" fill="#777">进一步</text><rect x="70" y="777" width="670" height="61" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><circle cx="98" cy="799" r="13" fill="#78909c"/><text x="98" y="804" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="122" y="804" font-size="16" font-weight="700" fill="#1d1d1f">各阶段的方法与语言</text><text x="726" y="804" text-anchor="end" font-size="13" fill="#666">74:59–92:42</text><text x="122" y="827" font-size="14" fill="#333">软工为每阶段造方法和中间语言，形式化程度逐级升高</text><line x1="98" y1="846" x2="98" y2="868" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="861" font-size="13" fill="#777">举例</text><rect x="70" y="872" width="670" height="61" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/><circle cx="98" cy="894" r="13" fill="#5c6bc0"/><text x="98" y="899" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">9</text><text x="122" y="899" font-size="16" font-weight="700" fill="#1d1d1f">UML 与语义对齐</text><text x="726" y="899" text-anchor="end" font-size="13" fill="#666">92:42–100:03</text><text x="122" y="922" font-size="14" fill="#333">UML 想把能对齐的语义从自然语言歧义中剥离出来</text></svg>
