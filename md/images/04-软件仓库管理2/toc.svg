<svg xmlns="http://www.w3.org/2000/svg" width="760" height="953" viewBox="0 0 760 953" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1f">04 · 软件仓库管理 (2)</text><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#444">版本管理的本质是记住现在、历史和教训；agent 时代要围绕修改、并行和</text><text x="380.0" y="92" text-anchor="middle" font-size="15" fill="#444">锁重新设计，早期项目要小步起步而不是让 AI 一次做完。</text><rect x="70" y="112" width="670" height="61" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/><circle cx="98" cy="134" r="13" fill="#4a7bd0"/><text x="98" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="122" y="139" font-size="16" font-weight="700" fill="#1d1d1f">个人助手实验与焦油坑</text><text x="726" y="139" text-anchor="end" font-size="13" fill="#666">00:00–05:17</text><text x="122" y="162" font-size="14" fill="#333">让 AI 一口气做完个人助手，会掉进焦油坑</text><line x1="98" y1="181" x2="98" y2="203" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="196" font-size="13" fill="#777">转向</text><rect x="70" y="207" width="670" height="61" rx="10" fill="#e6f4ea" stroke="#3c8c55" stroke-width="1.5"/><circle cx="98" cy="229" r="13" fill="#3c8c55"/><text x="98" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="122" y="234" font-size="16" font-weight="700" fill="#1d1d1f">文件系统装不下项目的关联</text><text x="726" y="234" text-anchor="end" font-size="13" fill="#666">05:17–19:20</text><text x="122" y="257" font-size="14" fill="#333">文件系统表达不了制品间的关联，未来项目可能是带视图的图</text><line x1="98" y1="276" x2="98" y2="298" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="291" font-size="13" fill="#777">转向</text><rect x="70" y="302" width="670" height="61" rx="10" fill="#fef7e0" stroke="#c9a227" stroke-width="1.5"/><circle cx="98" cy="324" r="13" fill="#c9a227"/><text x="98" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="122" y="329" font-size="16" font-weight="700" fill="#1d1d1f">经典课程不会被 AI 淘汰</text><text x="726" y="329" text-anchor="end" font-size="13" fill="#666">19:20–22:56</text><text x="122" y="352" font-size="14" fill="#333">经典课程的知识不会过时，要主动去看外面的世界</text><line x1="98" y1="371" x2="98" y2="393" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="386" font-size="13" fill="#777">进一步</text><rect x="70" y="397" width="670" height="61" rx="10" fill="#fce8e6" stroke="#c5523f" stroke-width="1.5"/><circle cx="98" cy="419" r="13" fill="#c5523f"/><text x="98" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="122" y="424" font-size="16" font-weight="700" fill="#1d1d1f">把修改变成一等对象</text><text x="726" y="424" text-anchor="end" font-size="13" fill="#666">22:56–36:02</text><text x="122" y="447" font-size="14" fill="#333">把修改本身当一等对象，版本管理才顺手</text><line x1="98" y1="466" x2="98" y2="488" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="481" font-size="13" fill="#777">转向</text><rect x="70" y="492" width="670" height="61" rx="10" fill="#f3e8fd" stroke="#8a55c9" stroke-width="1.5"/><circle cx="98" cy="514" r="13" fill="#8a55c9"/><text x="98" y="519" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="122" y="519" font-size="16" font-weight="700" fill="#1d1d1f">agent 的速度超出 git 的设计</text><text x="726" y="519" text-anchor="end" font-size="13" fill="#666">36:02–51:13</text><text x="122" y="542" font-size="14" fill="#333">git 为单线程的人设计，agent 提速后跟不上</text><line x1="98" y1="561" x2="98" y2="583" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="576" font-size="13" fill="#777">进一步</text><rect x="70" y="587" width="670" height="61" rx="10" fill="#e4f7fb" stroke="#2b93a8" stroke-width="1.5"/><circle cx="98" cy="609" r="13" fill="#2b93a8"/><text x="98" y="614" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="122" y="614" font-size="16" font-weight="700" fill="#1d1d1f">agent 团队用悲观锁</text><text x="726" y="614" text-anchor="end" font-size="13" fill="#666">51:13–63:44</text><text x="122" y="637" font-size="14" fill="#333">agent 团队不需要追责，该用悲观锁防冲突</text><line x1="98" y1="656" x2="98" y2="678" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="671" font-size="13" fill="#777">转向</text><rect x="70" y="682" width="670" height="61" rx="10" fill="#fdeee0" stroke="#d27b2c" stroke-width="1.5"/><circle cx="98" cy="704" r="13" fill="#d27b2c"/><text x="98" y="709" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="122" y="709" font-size="16" font-weight="700" fill="#1d1d1f">难点是团队管理与分工</text><text x="726" y="709" text-anchor="end" font-size="13" fill="#666">63:44–68:25</text><text x="122" y="732" font-size="14" fill="#333">版本控制只是工具，真正难的是团队分工管理</text><line x1="98" y1="751" x2="98" y2="773" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="766" font-size="13" fill="#777">举例</text><rect x="70" y="777" width="670" height="61" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><circle cx="98" cy="799" r="13" fill="#78909c"/><text x="98" y="804" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="122" y="804" font-size="16" font-weight="700" fill="#1d1d1f">汉诺塔产品：先用 git 存数据</text><text x="726" y="804" text-anchor="end" font-size="13" fill="#666">68:25–77:50</text><text x="122" y="827" font-size="14" fill="#333">早期用 git 存用户数据，需求收敛后再迁数据库</text><line x1="98" y1="846" x2="98" y2="868" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="861" font-size="13" fill="#777">回到</text><rect x="70" y="872" width="670" height="61" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/><circle cx="98" cy="894" r="13" fill="#5c6bc0"/><text x="98" y="899" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">9</text><text x="122" y="899" font-size="16" font-weight="700" fill="#1d1d1f">直接丢需求只得到没人要的东西</text><text x="726" y="899" text-anchor="end" font-size="13" fill="#666">77:50–98:29</text><text x="122" y="922" font-size="14" fill="#333">直接把需求丢给 agent 只会得到没人要的成品</text></svg>
