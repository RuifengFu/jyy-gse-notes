<svg xmlns="http://www.w3.org/2000/svg" width="760" height="953" viewBox="0 0 760 953" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1f">09 · DeepSeek Harness</text><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#444">架构是在限制与自由之间的取舍。DeepSeek harness 只给一个干净的事件内核，让插</text><text x="380.0" y="92" text-anchor="middle" font-size="15" fill="#444">件和 super app 长成 AI 原生的软件生态。</text><rect x="70" y="112" width="670" height="61" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/><circle cx="98" cy="134" r="13" fill="#4a7bd0"/><text x="98" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="122" y="139" font-size="16" font-weight="700" fill="#1d1d1f">版本控制不够用了</text><text x="726" y="139" text-anchor="end" font-size="13" fill="#666">00:00–03:07</text><text x="122" y="162" font-size="14" fill="#333">多 agent 会形成组织架构，版本控制要升级成带类型的任务锁</text><line x1="98" y1="181" x2="98" y2="203" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="196" font-size="13" fill="#777">转向</text><rect x="70" y="207" width="670" height="61" rx="10" fill="#e6f4ea" stroke="#3c8c55" stroke-width="1.5"/><circle cx="98" cy="229" r="13" fill="#3c8c55"/><text x="98" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="122" y="234" font-size="16" font-weight="700" fill="#1d1d1f">从玩具 agent 到产品</text><text x="726" y="234" text-anchor="end" font-size="13" fill="#666">03:07–17:55</text><text x="122" y="257" font-size="14" fill="#333">150 行 agent 一遇网络中断就垮，真产品背后是大量本质复杂性</text><line x1="98" y1="276" x2="98" y2="298" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="291" font-size="13" fill="#777">进一步</text><rect x="70" y="302" width="670" height="61" rx="10" fill="#fef7e0" stroke="#c9a227" stroke-width="1.5"/><circle cx="98" cy="324" r="13" fill="#c9a227"/><text x="98" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="122" y="329" font-size="16" font-weight="700" fill="#1d1d1f">需求一变架构崩塌</text><text x="726" y="329" text-anchor="end" font-size="13" fill="#666">17:55–23:37</text><text x="122" y="352" font-size="14" fill="#333">需求会被颠覆，大厂架构偏保守，开源社区能光速复刻并扩展</text><line x1="98" y1="371" x2="98" y2="393" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="386" font-size="13" fill="#777">因此</text><rect x="70" y="397" width="670" height="61" rx="10" fill="#fce8e6" stroke="#c5523f" stroke-width="1.5"/><circle cx="98" cy="419" r="13" fill="#c5523f"/><text x="98" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="122" y="424" font-size="16" font-weight="700" fill="#1d1d1f">架构是受限与自由的取舍</text><text x="726" y="424" text-anchor="end" font-size="13" fill="#666">23:37–38:44</text><text x="122" y="447" font-size="14" fill="#333">任何架构都在限制与自由间取舍，只有匹配需求时才好用</text><line x1="98" y1="466" x2="98" y2="488" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="481" font-size="13" fill="#777">因此</text><rect x="70" y="492" width="670" height="61" rx="10" fill="#f3e8fd" stroke="#8a55c9" stroke-width="1.5"/><circle cx="98" cy="514" r="13" fill="#8a55c9"/><text x="98" y="519" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="122" y="519" font-size="16" font-weight="700" fill="#1d1d1f">一切皆插件的内核</text><text x="726" y="519" text-anchor="end" font-size="13" fill="#666">38:44–53:31</text><text x="122" y="542" font-size="14" fill="#333">好内核只规定世界模型，让插件通过事件总线协作</text><line x1="98" y1="561" x2="98" y2="583" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="576" font-size="13" fill="#777">进一步</text><rect x="70" y="587" width="670" height="61" rx="10" fill="#e4f7fb" stroke="#2b93a8" stroke-width="1.5"/><circle cx="98" cy="609" r="13" fill="#2b93a8"/><text x="98" y="614" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="122" y="614" font-size="16" font-weight="700" fill="#1d1d1f">白板内核与许愿插件</text><text x="726" y="614" text-anchor="end" font-size="13" fill="#666">53:31–62:55</text><text x="122" y="637" font-size="14" fill="#333">内核足够干净，TUI 和类 VS Code 界面都能许愿出来</text><line x1="98" y1="656" x2="98" y2="678" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="671" font-size="13" fill="#777">但是</text><rect x="70" y="682" width="670" height="61" rx="10" fill="#fdeee0" stroke="#d27b2c" stroke-width="1.5"/><circle cx="98" cy="704" r="13" fill="#d27b2c"/><text x="98" y="709" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="122" y="709" font-size="16" font-weight="700" fill="#1d1d1f">插件的代价</text><text x="726" y="709" text-anchor="end" font-size="13" fill="#666">62:55–65:37</text><text x="122" y="732" font-size="14" fill="#333">插件只能消除偶然复杂性，语义冲突仍要另外解决</text><line x1="98" y1="751" x2="98" y2="773" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="766" font-size="13" fill="#777">进一步</text><rect x="70" y="777" width="670" height="61" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><circle cx="98" cy="799" r="13" fill="#78909c"/><text x="98" y="804" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="122" y="804" font-size="16" font-weight="700" fill="#1d1d1f">生态才是架构的回报</text><text x="726" y="804" text-anchor="end" font-size="13" fill="#666">65:37–84:47</text><text x="122" y="827" font-size="14" fill="#333">干净架构让任何 super app 和生成式 UI 接入 AI 生态</text><line x1="98" y1="846" x2="98" y2="868" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="861" font-size="13" fill="#777">因此</text><rect x="70" y="872" width="670" height="61" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/><circle cx="98" cy="894" r="13" fill="#5c6bc0"/><text x="98" y="899" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">9</text><text x="122" y="899" font-size="16" font-weight="700" fill="#1d1d1f">开发者与厂商的机会</text><text x="726" y="899" text-anchor="end" font-size="13" fill="#666">84:47–89:27</text><text x="122" y="922" font-size="14" fill="#333">AI 原生接入让应用的竞争点从功能转向生态与个人数据</text></svg>
