<svg xmlns="http://www.w3.org/2000/svg" width="760" height="953" viewBox="0 0 760 953" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1f">14 · 软件发布与运维</text><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#444">AI 让许愿变得容易，但发布与运维仍靠你对领域的理解、</text><text x="380.0" y="92" text-anchor="middle" font-size="15" fill="#444">清晰的 intent 和验收标准来掌控。</text><rect x="70" y="112" width="670" height="61" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/><circle cx="98" cy="134" r="13" fill="#4a7bd0"/><text x="98" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="122" y="139" font-size="16" font-weight="700" fill="#1d1d1f">许愿时代的数学核弹</text><text x="726" y="139" text-anchor="end" font-size="13" fill="#666">00:00–10:05</text><text x="122" y="162" font-size="14" fill="#333">许愿已成真，数学难题被人机协作和算力攻克</text><line x1="98" y1="181" x2="98" y2="203" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="196" font-size="13" fill="#777">因此</text><rect x="70" y="207" width="670" height="61" rx="10" fill="#e6f4ea" stroke="#3c8c55" stroke-width="1.5"/><circle cx="98" cy="229" r="13" fill="#3c8c55"/><text x="98" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="122" y="234" font-size="16" font-weight="700" fill="#1d1d1f">智力贬值之后</text><text x="726" y="234" text-anchor="end" font-size="13" fill="#666">10:05–16:21</text><text x="122" y="257" font-size="14" fill="#333">智力像体力一样贬值，人该去问更大的问题</text><line x1="98" y1="276" x2="98" y2="298" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="291" font-size="13" fill="#777">举例</text><rect x="70" y="302" width="670" height="61" rx="10" fill="#fef7e0" stroke="#c9a227" stroke-width="1.5"/><circle cx="98" cy="324" r="13" fill="#c9a227"/><text x="98" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="122" y="329" font-size="16" font-weight="700" fill="#1d1d1f">把自己蒸馏成 prompt</text><text x="726" y="329" text-anchor="end" font-size="13" fill="#666">16:21–31:19</text><text x="122" y="352" font-size="14" fill="#333">偏好可蒸馏成 prompt，用评测打分迭代就是发现理论</text><line x1="98" y1="371" x2="98" y2="393" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="386" font-size="13" fill="#777">回到</text><rect x="70" y="397" width="670" height="61" rx="10" fill="#fce8e6" stroke="#c5523f" stroke-width="1.5"/><circle cx="98" cy="419" r="13" fill="#c5523f"/><text x="98" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="122" y="424" font-size="16" font-weight="700" fill="#1d1d1f">发布远比拷贝复杂</text><text x="726" y="424" text-anchor="end" font-size="13" fill="#666">31:19–43:25</text><text x="122" y="447" font-size="14" fill="#333">发布不是拷贝 binary，而是平台、硬件与流水线的组合</text><line x1="98" y1="466" x2="98" y2="488" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="481" font-size="13" fill="#777">进一步</text><rect x="70" y="492" width="670" height="61" rx="10" fill="#f3e8fd" stroke="#8a55c9" stroke-width="1.5"/><circle cx="98" cy="514" r="13" fill="#8a55c9"/><text x="98" y="519" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="122" y="519" font-size="16" font-weight="700" fill="#1d1d1f">验收指标与架构</text><text x="726" y="519" text-anchor="end" font-size="13" fill="#666">43:25–47:38</text><text x="122" y="542" font-size="14" fill="#333">给出验收指标，AI 会自己修；架构决定能否承受需求变更</text><line x1="98" y1="561" x2="98" y2="583" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="576" font-size="13" fill="#777">转向</text><rect x="70" y="587" width="670" height="61" rx="10" fill="#e4f7fb" stroke="#2b93a8" stroke-width="1.5"/><circle cx="98" cy="609" r="13" fill="#2b93a8"/><text x="98" y="614" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="122" y="614" font-size="16" font-weight="700" fill="#1d1d1f">部署服务就是担责</text><text x="726" y="614" text-anchor="end" font-size="13" fill="#666">47:38–61:15</text><text x="122" y="637" font-size="14" fill="#333">服务一上线，你就要为安全与可信访问负责</text><line x1="98" y1="656" x2="98" y2="678" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="671" font-size="13" fill="#777">转向</text><rect x="70" y="682" width="670" height="61" rx="10" fill="#fdeee0" stroke="#d27b2c" stroke-width="1.5"/><circle cx="98" cy="704" r="13" fill="#d27b2c"/><text x="98" y="709" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="122" y="709" font-size="16" font-weight="700" fill="#1d1d1f">线上多版本的演进</text><text x="726" y="709" text-anchor="end" font-size="13" fill="#666">61:15–73:19</text><text x="122" y="732" font-size="14" fill="#333">运维面对正在运行的多个版本，迁移难度取决于架构</text><line x1="98" y1="751" x2="98" y2="773" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="766" font-size="13" fill="#777">进一步</text><rect x="70" y="777" width="670" height="61" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><circle cx="98" cy="799" r="13" fill="#78909c"/><text x="98" y="804" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="122" y="804" font-size="16" font-weight="700" fill="#1d1d1f">配置调优与 SRE</text><text x="726" y="804" text-anchor="end" font-size="13" fill="#666">73:19–83:51</text><text x="122" y="827" font-size="14" fill="#333">配置取舍全凭经验，Google 为此设立 SRE 工种</text><line x1="98" y1="846" x2="98" y2="868" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="861" font-size="13" fill="#777">因此</text><rect x="70" y="872" width="670" height="61" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/><circle cx="98" cy="894" r="13" fill="#5c6bc0"/><text x="98" y="899" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">9</text><text x="122" y="899" font-size="16" font-weight="700" fill="#1d1d1f">灰度发布与早期用户</text><text x="726" y="899" text-anchor="end" font-size="13" fill="#666">83:51–91:00</text><text x="122" y="922" font-size="14" fill="#333">灰度发布用小流量做统计验证，并随时可回滚</text></svg>
