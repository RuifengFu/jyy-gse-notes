<svg xmlns="http://www.w3.org/2000/svg" width="760" height="858" viewBox="0 0 760 858" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1f">01 · 欢迎来到未来</text><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#444">AI 已能独立完成单个任务，但软件工程里意图、规格、实现之间的鸿沟仍要</text><text x="380.0" y="92" text-anchor="middle" font-size="15" fill="#444">人来补，会驾驭 Agent 并把握这些鸿沟的人才有竞争力。</text><rect x="70" y="112" width="670" height="61" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/><circle cx="98" cy="134" r="13" fill="#4a7bd0"/><text x="98" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="122" y="139" font-size="16" font-weight="700" fill="#1d1d1f">从简历焦虑到课程定位</text><text x="726" y="139" text-anchor="end" font-size="13" fill="#666">00:00–07:22</text><text x="122" y="162" font-size="14" fill="#333">AI 让作业与简历同质化，应对之道是学会驾驭 AI</text><line x1="98" y1="181" x2="98" y2="203" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="196" font-size="13" fill="#777">转向</text><rect x="70" y="207" width="670" height="61" rx="10" fill="#e6f4ea" stroke="#3c8c55" stroke-width="1.5"/><circle cx="98" cy="229" r="13" fill="#3c8c55"/><text x="98" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="122" y="234" font-size="16" font-weight="700" fill="#1d1d1f">课程做法与考核约定</text><text x="726" y="234" text-anchor="end" font-size="13" fill="#666">07:22–20:24</text><text x="122" y="257" font-size="14" fill="#333">课程以案例为主，讲义即代码，考核看你做出了什么</text><line x1="98" y1="276" x2="98" y2="298" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="291" font-size="13" fill="#777">转向</text><rect x="70" y="302" width="670" height="61" rx="10" fill="#fef7e0" stroke="#c9a227" stroke-width="1.5"/><circle cx="98" cy="324" r="13" fill="#c9a227"/><text x="98" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="122" y="329" font-size="16" font-weight="700" fill="#1d1d1f">大模型到 Agent 的演进</text><text x="726" y="329" text-anchor="end" font-size="13" fill="#666">20:24–29:56</text><text x="122" y="352" font-size="14" fill="#333">大模型只是概率分布，加上循环与工具就成了能自主干活的 Agent</text><line x1="98" y1="371" x2="98" y2="393" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="386" font-size="13" fill="#777">进一步</text><rect x="70" y="397" width="670" height="61" rx="10" fill="#fce8e6" stroke="#c5523f" stroke-width="1.5"/><circle cx="98" cy="419" r="13" fill="#c5523f"/><text x="98" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="122" y="424" font-size="16" font-weight="700" fill="#1d1d1f">普通人用 Agent 的能力</text><text x="726" y="424" text-anchor="end" font-size="13" fill="#666">29:56–50:28</text><text x="122" y="447" font-size="14" fill="#333">Agent 把学习、日常事务、读书读论文的效率拉开十倍百倍差距</text><line x1="98" y1="466" x2="98" y2="488" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="481" font-size="13" fill="#777">进一步</text><rect x="70" y="492" width="670" height="61" rx="10" fill="#f3e8fd" stroke="#8a55c9" stroke-width="1.5"/><circle cx="98" cy="514" r="13" fill="#8a55c9"/><text x="98" y="519" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="122" y="519" font-size="16" font-weight="700" fill="#1d1d1f">插件、浏览器与技能组合</text><text x="726" y="519" text-anchor="end" font-size="13" fill="#666">50:28–64:52</text><text x="122" y="542" font-size="14" fill="#333">插件与技能可以复用组合，形成越转越快的个人信息飞轮</text><line x1="98" y1="561" x2="98" y2="583" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="576" font-size="13" fill="#777">但是</text><rect x="70" y="587" width="670" height="61" rx="10" fill="#e4f7fb" stroke="#2b93a8" stroke-width="1.5"/><circle cx="98" cy="609" r="13" fill="#2b93a8"/><text x="98" y="614" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="122" y="614" font-size="16" font-weight="700" fill="#1d1d1f">计算机人的边界与 Excel 偷数据</text><text x="726" y="614" text-anchor="end" font-size="13" fill="#666">64:52–74:47</text><text x="122" y="637" font-size="14" fill="#333">懂计算机的人知道什么该交给模型、什么该写成确定性代码</text><line x1="98" y1="656" x2="98" y2="678" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="671" font-size="13" fill="#777">但是</text><rect x="70" y="682" width="670" height="61" rx="10" fill="#fdeee0" stroke="#d27b2c" stroke-width="1.5"/><circle cx="98" cy="704" r="13" fill="#d27b2c"/><text x="98" y="709" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="122" y="709" font-size="16" font-weight="700" fill="#1d1d1f">软件工程鸿沟与 AI 的失败</text><text x="726" y="709" text-anchor="end" font-size="13" fill="#666">74:47–94:47</text><text x="122" y="732" font-size="14" fill="#333">AI 擅长完成任务却不会设计，软件在意图到实现的鸿沟上暴毙</text><line x1="98" y1="751" x2="98" y2="773" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="766" font-size="13" fill="#777">进一步</text><rect x="70" y="777" width="670" height="61" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><circle cx="98" cy="799" r="13" fill="#78909c"/><text x="98" y="804" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="122" y="804" font-size="16" font-weight="700" fill="#1d1d1f">AI 还缺品位与课程展望</text><text x="726" y="804" text-anchor="end" font-size="13" fill="#666">94:47–100:02</text><text x="122" y="827" font-size="14" fill="#333">考试训练出的做题家不如 AI，工程品位也许是人最后的价值</text></svg>
