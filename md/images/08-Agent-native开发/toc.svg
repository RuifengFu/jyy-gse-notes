<svg xmlns="http://www.w3.org/2000/svg" width="760" height="953" viewBox="0 0 760 953" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1f">08 · Agent-native 开发</text><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#444">Agent 原生开发靠外层循环把长任务拆成状态迁移，再在每步设自动门</text><text x="380.0" y="92" text-anchor="middle" font-size="15" fill="#444">控，防止不可信的 agent 把项目拖进 slop。</text><rect x="70" y="112" width="670" height="61" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/><circle cx="98" cy="134" r="13" fill="#4a7bd0"/><text x="98" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="122" y="139" font-size="16" font-weight="700" fill="#1d1d1f">算力换智力的搜索</text><text x="726" y="139" text-anchor="end" font-size="13" fill="#666">00:00–05:48</text><text x="122" y="162" font-size="14" fill="#333">长任务靠算力换智力，需兼顾搜索宽度与深度</text><line x1="98" y1="181" x2="98" y2="203" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="196" font-size="13" fill="#777">转向</text><rect x="70" y="207" width="670" height="61" rx="10" fill="#e6f4ea" stroke="#3c8c55" stroke-width="1.5"/><circle cx="98" cy="229" r="13" fill="#3c8c55"/><text x="98" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="122" y="234" font-size="16" font-weight="700" fill="#1d1d1f">软件工程是空间收敛</text><text x="726" y="234" text-anchor="end" font-size="13" fill="#666">05:48–10:55</text><text x="122" y="257" font-size="14" fill="#333">软件工程就是在意图到实现的空间里逐步收敛</text><line x1="98" y1="276" x2="98" y2="298" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="291" font-size="13" fill="#777">因此</text><rect x="70" y="302" width="670" height="61" rx="10" fill="#fef7e0" stroke="#c9a227" stroke-width="1.5"/><circle cx="98" cy="324" r="13" fill="#c9a227"/><text x="98" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="122" y="329" font-size="16" font-weight="700" fill="#1d1d1f">150 行写出 agent</text><text x="726" y="329" text-anchor="end" font-size="13" fill="#666">10:55–21:49</text><text x="122" y="352" font-size="14" fill="#333">agent 本质是 while 循环加 bash，一百五十行即可</text><line x1="98" y1="371" x2="98" y2="393" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="386" font-size="13" fill="#777">进一步</text><rect x="70" y="397" width="670" height="61" rx="10" fill="#fce8e6" stroke="#c5523f" stroke-width="1.5"/><circle cx="98" cy="419" r="13" fill="#c5523f"/><text x="98" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="122" y="424" font-size="16" font-weight="700" fill="#1d1d1f">Ralph loop 与状态机</text><text x="726" y="424" text-anchor="end" font-size="13" fill="#666">21:49–40:50</text><text x="122" y="447" font-size="14" fill="#333">Ralph loop 把长任务拆成状态机小步来抑制漂移</text><line x1="98" y1="466" x2="98" y2="488" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="481" font-size="13" fill="#777">因此</text><rect x="70" y="492" width="670" height="61" rx="10" fill="#f3e8fd" stroke="#8a55c9" stroke-width="1.5"/><circle cx="98" cy="514" r="13" fill="#8a55c9"/><text x="98" y="519" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="122" y="519" font-size="16" font-weight="700" fill="#1d1d1f">CI/CD：步步设门禁</text><text x="726" y="519" text-anchor="end" font-size="13" fill="#666">40:50–52:44</text><text x="122" y="542" font-size="14" fill="#333">每一步后自动检查就是 CI/CD，因为开发者不可信</text><line x1="98" y1="561" x2="98" y2="583" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="576" font-size="13" fill="#777">进一步</text><rect x="70" y="587" width="670" height="61" rx="10" fill="#e4f7fb" stroke="#2b93a8" stroke-width="1.5"/><circle cx="98" cy="609" r="13" fill="#2b93a8"/><text x="98" y="614" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="122" y="614" font-size="16" font-weight="700" fill="#1d1d1f">agent 是更不可信的人</text><text x="726" y="614" text-anchor="end" font-size="13" fill="#666">52:44–59:36</text><text x="122" y="637" font-size="14" fill="#333">agent 是最不可信的开发者，需要硬门控防 slop</text><line x1="98" y1="656" x2="98" y2="678" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="671" font-size="13" fill="#777">举例</text><rect x="70" y="682" width="670" height="61" rx="10" fill="#fdeee0" stroke="#d27b2c" stroke-width="1.5"/><circle cx="98" cy="704" r="13" fill="#d27b2c"/><text x="98" y="709" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="122" y="709" font-size="16" font-weight="700" fill="#1d1d1f">工业界的门控实践</text><text x="726" y="709" text-anchor="end" font-size="13" fill="#666">59:36–66:55</text><text x="122" y="732" font-size="14" fill="#333">工业界的 agent native 开发靠状态迁移上的门控</text><line x1="98" y1="751" x2="98" y2="773" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="766" font-size="13" fill="#777">举例</text><rect x="70" y="777" width="670" height="61" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><circle cx="98" cy="799" r="13" fill="#78909c"/><text x="98" y="804" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="122" y="804" font-size="16" font-weight="700" fill="#1d1d1f">DeepSeek 的文档门禁</text><text x="726" y="804" text-anchor="end" font-size="13" fill="#666">66:55–90:21</text><text x="122" y="827" font-size="14" fill="#333">DeepSeek harness 用配对契约加门禁保持文档一致</text><line x1="98" y1="846" x2="98" y2="868" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="861" font-size="13" fill="#777">转向</text><rect x="70" y="872" width="670" height="61" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/><circle cx="98" cy="894" r="13" fill="#5c6bc0"/><text x="98" y="899" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">9</text><text x="122" y="899" font-size="16" font-weight="700" fill="#1d1d1f">斩杀线与大学</text><text x="726" y="899" text-anchor="end" font-size="13" fill="#666">90:21–97:12</text><text x="122" y="922" font-size="14" fill="#333">试错机会决定谁不被 agent 斩杀，大学也受冲击</text></svg>
