<svg xmlns="http://www.w3.org/2000/svg" width="760" height="953" viewBox="0 0 760 953" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1f">11 · 软件质量保障 (1)</text><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#444">许愿编程让人失去对软件的掌控。质量保障先靠架构，再用测试、</text><text x="380.0" y="92" text-anchor="middle" font-size="15" fill="#444">差分、模糊等方法，从输入和检查两端暴露 bug。</text><rect x="70" y="112" width="670" height="61" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/><circle cx="98" cy="134" r="13" fill="#4a7bd0"/><text x="98" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="122" y="139" font-size="16" font-weight="700" fill="#1d1d1f">许愿编程丢掉了掌控</text><text x="726" y="139" text-anchor="end" font-size="13" fill="#666">00:00–06:45</text><text x="122" y="162" font-size="14" fill="#333">AI 一步造航母，人类跳过演化就失去对软件的掌控</text><line x1="98" y1="181" x2="98" y2="203" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="196" font-size="13" fill="#777">因此</text><rect x="70" y="207" width="670" height="61" rx="10" fill="#e6f4ea" stroke="#3c8c55" stroke-width="1.5"/><circle cx="98" cy="229" r="13" fill="#3c8c55"/><text x="98" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="122" y="234" font-size="16" font-weight="700" fill="#1d1d1f">bug 是规格与实现不一致</text><text x="726" y="234" text-anchor="end" font-size="13" fill="#666">06:45–24:34</text><text x="122" y="257" font-size="14" fill="#333">bug 是实现偏离规格，错误悄悄传播才难找</text><line x1="98" y1="276" x2="98" y2="298" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="291" font-size="13" fill="#777">因此</text><rect x="70" y="302" width="670" height="61" rx="10" fill="#fef7e0" stroke="#c9a227" stroke-width="1.5"/><circle cx="98" cy="324" r="13" fill="#c9a227"/><text x="98" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="122" y="329" font-size="16" font-weight="700" fill="#1d1d1f">语言与架构先于测试</text><text x="726" y="329" text-anchor="end" font-size="13" fill="#666">24:34–33:33</text><text x="122" y="352" font-size="14" fill="#333">选不易伤人的语言和架构，能从根上消灭整类 bug</text><line x1="98" y1="371" x2="98" y2="393" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="386" font-size="13" fill="#777">进一步</text><rect x="70" y="397" width="670" height="61" rx="10" fill="#fce8e6" stroke="#c5523f" stroke-width="1.5"/><circle cx="98" cy="419" r="13" fill="#c5523f"/><text x="98" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="122" y="424" font-size="16" font-weight="700" fill="#1d1d1f">输入暴露错误，检查识别错误</text><text x="726" y="424" text-anchor="end" font-size="13" fill="#666">33:33–38:52</text><text x="122" y="447" font-size="14" fill="#333">找 bug 需要能触发错误的输入和判断对错的检查</text><line x1="98" y1="466" x2="98" y2="488" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="481" font-size="13" fill="#777">但是</text><rect x="70" y="492" width="670" height="61" rx="10" fill="#f3e8fd" stroke="#8a55c9" stroke-width="1.5"/><circle cx="98" cy="514" r="13" fill="#8a55c9"/><text x="98" y="519" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="122" y="519" font-size="16" font-weight="700" fill="#1d1d1f">真实软件的测试很难</text><text x="726" y="519" text-anchor="end" font-size="13" fill="#666">38:52–47:11</text><text x="122" y="542" font-size="14" fill="#333">环境、非确定性和非功能需求让测试无法穷尽</text><line x1="98" y1="561" x2="98" y2="583" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="576" font-size="13" fill="#777">但是</text><rect x="70" y="587" width="670" height="61" rx="10" fill="#e4f7fb" stroke="#2b93a8" stroke-width="1.5"/><circle cx="98" cy="609" r="13" fill="#2b93a8"/><text x="98" y="614" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="122" y="614" font-size="16" font-weight="700" fill="#1d1d1f">测试建立信心并指引调试</text><text x="726" y="614" text-anchor="end" font-size="13" fill="#666">47:11–55:02</text><text x="122" y="637" font-size="14" fill="#333">程序可泛化，所以测试能建立信心，失败还能定位 fault</text><line x1="98" y1="656" x2="98" y2="678" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="671" font-size="13" fill="#777">进一步</text><rect x="70" y="682" width="670" height="61" rx="10" fill="#fdeee0" stroke="#d27b2c" stroke-width="1.5"/><circle cx="98" cy="704" r="13" fill="#d27b2c"/><text x="98" y="709" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="122" y="709" font-size="16" font-weight="700" fill="#1d1d1f">测试分层与覆盖率</text><text x="726" y="709" text-anchor="end" font-size="13" fill="#666">55:02–66:37</text><text x="122" y="732" font-size="14" fill="#333">小问题用单元测试查，覆盖率告诉你哪里没测过</text><line x1="98" y1="751" x2="98" y2="773" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="766" font-size="13" fill="#777">但是</text><rect x="70" y="777" width="670" height="61" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><circle cx="98" cy="799" r="13" fill="#78909c"/><text x="98" y="804" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="122" y="804" font-size="16" font-weight="700" fill="#1d1d1f">架构决定质量</text><text x="726" y="804" text-anchor="end" font-size="13" fill="#666">66:37–84:58</text><text x="122" y="827" font-size="14" fill="#333">架构没做好，再多测试也救不了质量</text><line x1="98" y1="846" x2="98" y2="868" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="861" font-size="13" fill="#777">举例</text><rect x="70" y="872" width="670" height="61" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/><circle cx="98" cy="894" r="13" fill="#5c6bc0"/><text x="98" y="899" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">9</text><text x="122" y="899" font-size="16" font-weight="700" fill="#1d1d1f">差分测试与模糊测试</text><text x="726" y="899" text-anchor="end" font-size="13" fill="#666">84:58–97:09</text><text x="122" y="922" font-size="14" fill="#333">有黄金版本或覆盖反馈，找 bug 就能自动化</text></svg>
