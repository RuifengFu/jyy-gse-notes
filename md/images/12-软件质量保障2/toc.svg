<svg xmlns="http://www.w3.org/2000/svg" width="760" height="953" viewBox="0 0 760 953" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1f">12 · 软件质量保障 (2)</text><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#444">测试只能找 bug，形式化证明才能保证正确；AI 让证明变</text><text x="380.0" y="92" text-anchor="middle" font-size="15" fill="#444">便宜，剩下的难题是让规约对齐人类意图。</text><rect x="70" y="112" width="670" height="61" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/><circle cx="98" cy="134" r="13" fill="#4a7bd0"/><text x="98" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="122" y="139" font-size="16" font-weight="700" fill="#1d1d1f">架构决定怎么测试</text><text x="726" y="139" text-anchor="end" font-size="13" fill="#666">00:00–05:47</text><text x="122" y="162" font-size="14" fill="#333">软件架构决定测试怎么写，好的系统设计仍靠人的智慧</text><line x1="98" y1="181" x2="98" y2="203" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="196" font-size="13" fill="#777">进一步</text><rect x="70" y="207" width="670" height="61" rx="10" fill="#e6f4ea" stroke="#3c8c55" stroke-width="1.5"/><circle cx="98" cy="229" r="13" fill="#3c8c55"/><text x="98" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="122" y="234" font-size="16" font-weight="700" fill="#1d1d1f">测试清单只留一份来源</text><text x="726" y="234" text-anchor="end" font-size="13" fill="#666">05:47–12:28</text><text x="122" y="257" font-size="14" fill="#333">项目变大后，用一张文档表格统一定义并驱动所有测试</text><line x1="98" y1="276" x2="98" y2="298" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="291" font-size="13" fill="#777">但是</text><rect x="70" y="302" width="670" height="61" rx="10" fill="#fef7e0" stroke="#c9a227" stroke-width="1.5"/><circle cx="98" cy="324" r="13" fill="#c9a227"/><text x="98" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="122" y="329" font-size="16" font-weight="700" fill="#1d1d1f">证明程序比调试更根本</text><text x="726" y="329" text-anchor="end" font-size="13" fill="#666">12:28–28:45</text><text x="122" y="352" font-size="14" fill="#333">与其反复调试，不如证明程序满足规约，Hoare 逻辑是早期答案</text><line x1="98" y1="371" x2="98" y2="393" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="386" font-size="13" fill="#777">转向</text><rect x="70" y="397" width="670" height="61" rx="10" fill="#fce8e6" stroke="#c5523f" stroke-width="1.5"/><circle cx="98" cy="419" r="13" fill="#c5523f"/><text x="98" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="122" y="424" font-size="16" font-weight="700" fill="#1d1d1f">暴力穷举与模型检验</text><text x="726" y="424" text-anchor="end" font-size="13" fill="#666">28:45–47:44</text><text x="122" y="447" font-size="14" fill="#333">枚举状态空间同样能证明正确，精化映射把模型连到代码</text><line x1="98" y1="466" x2="98" y2="488" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="481" font-size="13" fill="#777">进一步</text><rect x="70" y="492" width="670" height="61" rx="10" fill="#f3e8fd" stroke="#8a55c9" stroke-width="1.5"/><circle cx="98" cy="514" r="13" fill="#8a55c9"/><text x="98" y="519" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="122" y="519" font-size="16" font-weight="700" fill="#1d1d1f">证明编译器与内核</text><text x="726" y="519" text-anchor="end" font-size="13" fill="#666">47:44–53:30</text><text x="122" y="542" font-size="14" fill="#333">前人已证明整个编译器和操作系统内核，靠的是证明助手</text><line x1="98" y1="561" x2="98" y2="583" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="576" font-size="13" fill="#777">进一步</text><rect x="70" y="587" width="670" height="61" rx="10" fill="#e4f7fb" stroke="#2b93a8" stroke-width="1.5"/><circle cx="98" cy="609" r="13" fill="#2b93a8"/><text x="98" y="614" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="122" y="614" font-size="16" font-weight="700" fill="#1d1d1f">证明助手如何工作</text><text x="726" y="614" text-anchor="end" font-size="13" fill="#666">53:30–72:50</text><text x="122" y="637" font-size="14" fill="#333">证明助手把证明变成改写目标，命题就是类型、证明就是程序</text><line x1="98" y1="656" x2="98" y2="678" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="671" font-size="13" fill="#777">因此</text><rect x="70" y="682" width="670" height="61" rx="10" fill="#fdeee0" stroke="#d27b2c" stroke-width="1.5"/><circle cx="98" cy="704" r="13" fill="#d27b2c"/><text x="98" y="709" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="122" y="709" font-size="16" font-weight="700" fill="#1d1d1f">AI 让证明变便宜</text><text x="726" y="709" text-anchor="end" font-size="13" fill="#666">72:50–83:18</text><text x="122" y="732" font-size="14" fill="#333">AI 使证明不再昂贵，难处移到规约与意图的对齐</text><line x1="98" y1="751" x2="98" y2="773" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="766" font-size="13" fill="#777">进一步</text><rect x="70" y="777" width="670" height="61" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><circle cx="98" cy="799" r="13" fill="#78909c"/><text x="98" y="804" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="122" y="804" font-size="16" font-weight="700" fill="#1d1d1f">证明随代码一起交付</text><text x="726" y="804" text-anchor="end" font-size="13" fill="#666">83:18–89:07</text><text x="122" y="827" font-size="14" fill="#333">断言将来要能编译成证明，软件可靠性教科书都得重写</text><line x1="98" y1="846" x2="98" y2="868" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="861" font-size="13" fill="#777">但是</text><rect x="70" y="872" width="670" height="61" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/><circle cx="98" cy="894" r="13" fill="#5c6bc0"/><text x="98" y="899" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">9</text><text x="122" y="899" font-size="16" font-weight="700" fill="#1d1d1f">形式化止于人类意图</text><text x="726" y="899" text-anchor="end" font-size="13" fill="#666">89:07–95:12</text><text x="122" y="922" font-size="14" fill="#333">只有能独立于实现简洁表达的正确性，才适合形式化</text></svg>
